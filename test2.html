```html
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Boot Screen</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
}

/* =========================
   BOOT SCREEN
========================= */

#bootScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #292929 0%,
            #111111 40%,
            #050505 80%
        );

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

/* Erős háttérfény */

.bootGlow {
    position: absolute;

    width: 65vw;
    height: 45vw;

    max-width: 900px;
    max-height: 600px;

    border-radius: 50%;

    background: rgba(255,255,255,0.10);

    filter: blur(100px);

    animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {

    0% {
        transform: scale(.85);
        opacity: .35;
    }

    50% {
        transform: scale(1.08);
        opacity: .9;
    }

    100% {
        transform: scale(.85);
        opacity: .35;
    }
}


/* =========================
   TV
========================= */

.tv {
    position: relative;

    width: min(88vw, 1000px);

    aspect-ratio: 16 / 10;

    padding: 18px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #3a3a3a,
            #151515 45%,
            #050505
        );

    box-shadow:

        0 40px 100px rgba(0,0,0,.85),

        inset 0 2px 2px rgba(255,255,255,.16),

        inset 0 -5px 15px rgba(0,0,0,.9);

    animation:
        tvEnter 1.2s cubic-bezier(.16,1,.3,1);
}

@keyframes tvEnter {

    from {
        opacity: 0;
        transform:
            scale(.82)
            translateY(35px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}


/* =========================
   SCREEN
========================= */

.screen {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 17px;

    background: #020202;

    box-shadow:
        inset 0 0 45px rgba(0,0,0,.95),
        0 0 0 2px #080808;
}


/* Képernyő belső fény */

.screenGlow {

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.06),
            transparent 65%
        );

    animation: screenLight 2.5s ease-in-out infinite;
}

@keyframes screenLight {

    0% {
        opacity: .3;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: .3;
    }
}


/* =========================
   FÉNYCSÍK
========================= */

.lightBeam {

    position: absolute;

    top: -60%;

    left: -35%;

    width: 30%;

    height: 220%;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,.03) 25%,
            rgba(255,255,255,.35) 50%,
            rgba(255,255,255,.03) 75%,
            transparent 100%
        );

    filter: blur(5px);

    animation:
        lightSweep 2.8s ease-in-out infinite;
}

@keyframes lightSweep {

    0% {
        left: -45%;
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    65% {
        opacity: 1;
    }

    100% {
        left: 125%;
        opacity: 0;
    }
}


/* Második, szélesebb fény */

.lightBeamWide {

    position: absolute;

    top: -80%;
    left: -70%;

    width: 55%;
    height: 260%;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.045),
            transparent
        );

    filter: blur(20px);

    animation:
        wideSweep 4.5s ease-in-out infinite;
}

@keyframes wideSweep {

    0% {
        left: -80%;
    }

    100% {
        left: 140%;
    }
}


/* =========================
   TV LED
========================= */

.led {

    position: absolute;

    bottom: 9px;
    left: 50%;

    transform: translateX(-50%);

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 0 6px rgba(255,255,255,.8),
        0 0 15px rgba(255,255,255,.4);

    animation:
        ledPulse 1.5s ease-in-out infinite;
}

@keyframes ledPulse {

    0%,
    100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
   TV TALP
========================= */

.tvBottom {

    position: absolute;

    left: 50%;
    bottom: -28px;

    transform: translateX(-50%);

    width: 100px;
    height: 35px;

    border-radius:
        0 0 15px 15px;

    background:
        linear-gradient(
            #242424,
            #080808
        );
}

.stand {

    position: absolute;

    left: 50%;
    bottom: -60px;

    transform: translateX(-50%);

    width: 180px;
    height: 18px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            #111,
            #444,
            #111
        );

    box-shadow:
        0 12px 25px rgba(0,0,0,.7);
}


/* =========================
   BOOT FADE
========================= */

#bootScreen.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================
   SAJÁT WEBOLDAL
========================= */

#mainSite {

    position: fixed;

    inset: 0;

    overflow: auto;

    opacity: 0;

    transition: opacity 1s ease;

    background: #ffffff;
}

#mainSite.show {
    opacity: 1;
}


/* =========================
   MOBIL
========================= */

@media (max-width: 600px) {

    .tv {

        width: 94vw;

        padding: 10px;

        border-radius: 18px;
    }

    .screen {
        border-radius: 11px;
    }

    .tvBottom {

        bottom: -21px;

        width: 70px;
        height: 25px;
    }

    .stand {

        bottom: -43px;

        width: 110px;
    }
}
</style>
</head>


<body>


<!-- ==================================
     TV BOOT SCREEN
================================== -->

<div id="bootScreen">

    <div class="bootGlow"></div>

    <div class="tv">

        <div class="screen">

            <div class="screenGlow"></div>

            <div class="lightBeam"></div>

            <div class="lightBeamWide"></div>

        </div>

        <div class="led"></div>

        <div class="tvBottom"></div>

        <div class="stand"></div>

    </div>

</div>



<!-- ==================================
     SAJÁT WEBOLDAL
================================== -->

<div id="mainSite">
<style>
body {
  background-image: url("https://drive.google.com/uc?export=view&id=19TsSLPJaV1OBthvZQOpv5lpvBhBUUrer");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

</style>

</div>



<script>

/*
    TV BOOT ANIMATION

    2.8 másodperc után
    eltűnik a TV és megjelenik
    a valódi weboldal.
*/

window.addEventListener("load", () => {

    setTimeout(() => {

        const bootScreen =
            document.getElementById("bootScreen");

        const mainSite =
            document.getElementById("mainSite");


        bootScreen.classList.add("hide");

        mainSite.classList.add("show");


        /*
            Kis késleltetés után
            eltávolítjuk a boot screent,
            így nem marad ott a háttérben.
        */

        setTimeout(() => {

            bootScreen.remove();

        }, 1100);

    }, 2800);

});

</script>

</body>
</html>
```
