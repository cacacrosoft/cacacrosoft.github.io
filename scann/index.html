<h1 id="signature"></h1>

<script>
const params = new URLSearchParams(window.location.search);

const name = params.get("name");
const sig = params.get("sig");

function generateSignature(name) {
    return btoa(unescape(encodeURIComponent(name + "_secure_2026"))).substring(0,10);
}

if (name && sig && generateSignature(name) === sig) {
    document.getElementById("signature").textContent = "Aláírva: " + name;
} else {
    document.getElementById("signature").textContent = "Érvénytelen aláírás!";
}
</script>
